# Data source: where on-chain updates come from. Every type feeds the same
# framework dispatcher, so rules never see which one is configured. One of:
#   type = "yellowstone_grpc" Yellowstone gRPC via shipstern's client (default, production):
#                             auto_reconnect = true reconnects with slot replay + dedup
#   type = "websocket"        Solana PubSub for nodes without Geyser:
#                             url = "wss://api.mainnet-beta.solana.com", commitment = "confirmed"
#                             Transactions are fetched over [rpc] on each log notification.
#   type = "kafka"            janus raw topics (github.com/jup-ag/janus):
#                             brokers = "b1:9092,b2:9092", group_id = "sentinel",
#                             topics = ["raw.<program>.transactions", "raw.<program>.accounts"]
#                             auto_offset_reset = "latest"; extra librdkafka settings under
#                             [data_source.properties], e.g. "security.protocol" = "SASL_SSL".
#                             Records are matched locally, so a topic can carry more than the
#                             rules need. Replicas that must each see every record need
#                             distinct group_ids.
#   type = "multi"            several of the above merged: all get the same filters, rules see
#                             each update once (first delivery wins), and per-child lag,
#                             silence and missing items feed the health/source_divergence
#                             rule and the data_source_* metrics. See the commented example
#                             below and CONTRIBUTING.md ("Two providers").
#   type = "replay"           a recorded slot window (drills): path = "incident.jsonl",
#                             speed = 1.0 (0 = unpaced), timing = "block_time" | "nominal",
#                             slot_ms = 400, linger_seconds = 30, emit_log = "emit.jsonl".
#                             Record one with `sentinel-replay-record` (crates/data-source).
#                             The service exits 0 once the window is played.
# Every type also takes `sources_channel_size` (shipstern runtime buffer).
# Anything else: implement `shipstern::sources::SourceTrait` (see crates/data-source/).
[data_source]
type = "yellowstone_grpc"
endpoint = "https://your-yellowstone-endpoint:443"
token = "REPLACE_ME"
# gRPC client connection + request timeout, in seconds.
timeout_seconds = 120
# Client-side reconnect with slot replay and dedup; false makes a dropped
# stream stop the service instead.
auto_reconnect = true
# Largest gRPC message accepted, in bytes (default 16 MiB, above the 10 MiB account limit).
max_decoding_message_size = 16777216
# Bounded channel between the source and the pipelines, counted in updates, not bytes.
# Larger = more tolerance for downstream stalls, more memory (large accounts add up fast).
sources_channel_size = 10000

# Two independent providers instead (replace the table above):
# [data_source]
# type = "multi"
# grace_seconds = 30          # others have this long to deliver an item before it is "missing"
# retention_seconds = 300     # dedup memory; must exceed the slowest child's delay
# sources_channel_size = 10000
#
# [[data_source.sources]]
# name = "provider-a"
# type = "yellowstone_grpc"
# endpoint = "https://grpc.provider-a.example"
# token = "REPLACE_ME"
# # commitment = "processed"  # default; "confirmed" compares like-for-like with PubSub
#
# [[data_source.sources]]
# name = "provider-b"
# type = "websocket"
# url = "wss://ws.provider-b.example/REPLACE_ME"
# # getTransaction on the same provider, so the child does not depend on [rpc]:
# rpc_url = "https://rpc.provider-b.example/REPLACE_ME"
# commitment = "confirmed"

# RPC endpoint for on-demand queries (e.g. fetching account data).
[rpc]
url = "https://api.mainnet-beta.solana.com"
# Optional: headers sent on every RPC request (traffic attribution, auth).
# [rpc.headers]
# x-identity = "sentinel"

# Observability configuration.
[observability.server]
bind_addr = "127.0.0.1:8080"

# Optional. Omit the whole section for local runs.
[observability.betterstack]
heartbeat_url = "https://uptime.betterstack.com/api/v1/heartbeat/REPLACE_ME"
heartbeat_interval_seconds = 30

# ===========================================================================
# Sinks: where alerts are dispatched to.
#
# Each `[[sinks]]` block has:
#   - `type`: the sink kind (`clickhouse`, `slack`, ...). Determines which
#     fields are accepted on the block.
#   - `id`:   a user-chosen string identifier for this specific sink instance.
#             Must be unique across ALL sinks and is what `[[programs.rules]]`
#             references in its `sinks = [...]` list.
#
# The same `type` may appear multiple times under distinct `id`s, e.g. a
# `prod-archive` and `audit-archive` ClickHouse, or a `team-oncall` and
# `team-security` Slack webhook. Rules can route to any subset of them.
# ===========================================================================

# Stdout: prints alerts as JSON lines. Enough for a local run; route rules to it
# with `sinks = ["stdout"]`.
[[sinks]]
type = "stdout"
id = "stdout"

# JSON lines appended to a file, with `emitted_at`; for drills (several ids may share a path).
# [[sinks]]
# type = "jsonl"
# id = "drill"
# path = "alerts.jsonl"

# Primary ClickHouse: archival sink. Durable record-of-truth.
[[sinks]]
type = "clickhouse"
id = "primary-clickhouse"
url = "http://localhost:8123"
user = "default"
password = ""
database = "default"

# Secondary ClickHouse: separate cluster for compliance/audit retention.
[[sinks]]
type = "clickhouse"
id = "audit-clickhouse"
url = "http://audit-clickhouse.internal:8123"
user = "audit"
password = ""
database = "audit"

# Slack: on-call channel. Pages the team on critical events.
[[sinks]]
type = "slack"
id = "oncall-slack"
bot_auth_token = "xoxb-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
channel = "CXXXXXXXXX"
# HTTP timeout for the webhook POST, in seconds.
timeout_seconds = 10

# Slack: low-noise informational channel for non-paging events.
[[sinks]]
type = "slack"
id = "info-slack"
bot_auth_token = "xoxb-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
channel = "CXXXXXXXXX"
timeout_seconds = 10

[[sinks]]
type = "betterstack"
id = "betterstack"
incident_api_url = "https://incidents.betterstack.com/api/v3/incidents"
incident_auth_token = "REPLACE_ME"
escalation_policy_id = "REPLACE_ME"
requester_email = "REPLACE_ME"

# Optional; shown with defaults. The cooldown gate dedups an alert before it reaches a
# sink, in two layers: the local gate (this node, within the rule's
# `cooldown_period_seconds`) and the fleet gate (any node). Set either to false to skip it.
[alerting.cooldown_gate]
local_gate = true
fleet_gate = true
# Fleet gate claim TTL for rules that set no `cooldown_period_seconds`.
fleet_gate_default_ttl_seconds = 600

[redis]
# Per-pod sidecar Redis for the slot checkpoint and the local gate.
redis_sidecar_url = "redis://localhost:6379"
# Optional fleet-wide Redis cluster for the fleet gate. Without it the fleet
# gate still runs, but dedups within this process only.
redis_fleet_url = "redis://redis-fleet.example:6379"
