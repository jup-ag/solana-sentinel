services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      redis-standalone:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: monitoring
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "4000:3000" # host 4000 -> Grafana's 3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - clickhouse

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus # persist TSDB across restarts
    healthcheck:
      # The prom/prometheus image has no shell/curl/wget, but ships promtool,
      # which can query Prometheus' own /-/healthy endpoint.
      test:
        ["CMD", "promtool", "check", "healthy", "--url=http://localhost:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-cluster:
    image: redis:8-alpine
    volumes:
      - redis_cluster_data:/data
    ports:
      - "6379:6379"
      - "16379:16379"
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - "127.0.0.1"
      - --appendonly
      - "yes"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli cluster info | grep -q cluster_state:ok ||
          { redis-cli cluster addslotsrange 0 16383 >/dev/null 2>&1; exit 1; }
      interval: 5s
      timeout: 3s
      retries: 20

  redis-standalone:
    image: redis:8-alpine
    volumes:
      - redis_standalone_data:/data
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  clickhouse_data:
  clickhouse_logs:
  prometheus_data:
  grafana_data:
  redis_standalone_data:
  redis_cluster_data:
