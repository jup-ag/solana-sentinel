# JupLend Liquidity Reserve change
[[rules]]
program = "jup_lend"
name = "jup_lend_liquidity_reserve_change"
sinks = ["primary-clickhouse", "info-slack"]
cooldown_period_seconds = 300                      # 5 minutes
[rules.config]
threshold_bps = 5000                               # 50% change threshold
window_secs = 300                                  # 5 minutes window for change detection

# Service health: gRPC stream lagging behind RPC. Routed like any other rule
# (previously hard-wired to the `betterstack` sink).
[[rules]]
program = "system"
name = "slot_lag_detected"
sinks = ["betterstack"]
cooldown_period_seconds = 1800               # 30 minutes
[rules.config]
threshold_slots = 100
poll_interval_seconds = 120
