# Pyth Oracle staleness
[[rules]]
program = "pyth"
name = "oracle_staleness"
sinks = ["primary-clickhouse", "info-slack"]
cooldown_period_seconds = 300                # 5 minutes
[rules.config.thresholds]
"Dpw1EAVrSB1ibxiDQyTAW6Zip3J4Btk2x4SgApQCeFbX" = 480 # 8 minutes

# Pyth Oracle price drift
[[rules]]
program = "pyth"
name = "reference_price_drift"
sinks = ["primary-clickhouse", "info-slack"]
cooldown_period_seconds = 300                # 5 minutes
[rules.config.reference_prices]
"AqSwMCZYnEdnGoFCSLtWVnWf4xyCJuePcztmYWq8SBwp" = { ticker = "JUPUSD/USD", price = 100000000, exponent = -8, drift_bps = 25 } # 0.25% drift allowed

