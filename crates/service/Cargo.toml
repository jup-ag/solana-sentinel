[package]
name = "solana-sentinel-service"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
alerting = { workspace = true }
futures = { workspace = true }
data-source = { workspace = true }
domain = { workspace = true }
solana-sentinel = { workspace = true }
observability = { workspace = true }

anyhow = { workspace = true }
config = { workspace = true }

serde = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

shipstern = { workspace = true }
shipstern-core = { workspace = true }
shipstern-slot-parser = { workspace = true }
solana-rpc-client = { workspace = true }
solana-pubkey = { workspace = true }
reqwest = { workspace = true }

rustls = { workspace = true }
thiserror = { workspace = true }
redis = { workspace = true }
hostname = { workspace = true }

# `testing` feature: the end-to-end harness (scripted source, in-memory sinks).
async-trait = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
yellowstone-grpc-proto = { workspace = true, optional = true }

[features]
testing = ["dep:async-trait", "dep:parking_lot", "dep:yellowstone-grpc-proto"]

[dev-dependencies]
solana-sentinel-service = { path = ".", features = ["testing"] }
solana-sentinel = { workspace = true, features = ["testing"] }
solana-sentinel-rules-registry = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
