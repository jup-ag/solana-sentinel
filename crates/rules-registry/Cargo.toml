# Ready-made programs and rules a deployment can run as-is or copy from.
[package]
name = "solana-sentinel-rules-registry"
edition.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
solana-sentinel = { workspace = true }

shipstern-core = { workspace = true }
shipstern-parser = { workspace = true }
shipstern-proc-macro = { workspace = true }
shipstern-spl-token-parser = { workspace = true }
solana-account = { workspace = true }
solana-account-decoder-client-types = { workspace = true }
solana-program-pack = { workspace = true }
solana-pubkey = { workspace = true }
solana-rpc-client = { workspace = true }
spl-token-interface = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
borsh = { workspace = true }
bs58 = { workspace = true }
bytemuck = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
solana-sentinel = { workspace = true, features = ["testing"] }
solana-program-option = "3"
tokio = { workspace = true }

[lints]
workspace = true
