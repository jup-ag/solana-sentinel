[package]
name = "solana-sentinel-data-source"
edition.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "sentinel-replay-record"
path = "src/bin/sentinel-replay-record.rs"

[dependencies]
utility = { workspace = true }
observability = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = "0.23.1"
bs58 = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

shipstern = { workspace = true }
shipstern-core = { workspace = true }
shipstern-yellowstone-grpc-source = { workspace = true }
yellowstone-grpc-proto = { workspace = true }
solana-pubkey = { workspace = true }
solana-pubsub-client = "3.1"
solana-rpc-client = { workspace = true }
reqwest-rpc = { workspace = true }
solana-rpc-client-api = "3.1"
solana-account-decoder-client-types = { workspace = true }
solana-commitment-config = "3.1.1"
# 3.5+ moves to wincode 0.6, which solana-transaction 4.1 can't use.
solana-signature = "~3.4"
solana-transaction-status-client-types = "3.1"
solana-message = "~4.4.1"
solana-transaction = { version = "~4.1", features = ["wincode"] }
wincode = "0.5"

[dev-dependencies]
config = { workspace = true }
parking_lot = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
